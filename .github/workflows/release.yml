name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to belong to main
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Require the exact package-version tag
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          project = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]
          expected_tag = f"v{project['version']}"
          ref_name = os.environ["RELEASE_REF_NAME"]
          ref_type = os.environ["RELEASE_REF_TYPE"]
          if ref_type != "tag" or ref_name != expected_tag:
              raise SystemExit(
                  f"release ref must be tag {expected_tag!r}; "
                  f"received {ref_type} {ref_name!r}"
              )
          PY
      - name: Install the build frontend
        run: python -m pip install --disable-pip-version-check --no-input build==1.5.0
      - name: Build the release distributions once
        run: python -m build
      - name: Verify the release artifact set
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          project = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]
          stem = project["name"].replace("-", "_")
          version = project["version"]
          expected = {
              f"{stem}-{version}-py3-none-any.whl",
              f"{stem}-{version}.tar.gz",
          }
          actual = {path.name for path in Path("dist").iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(
                  f"unexpected release artifacts: expected {sorted(expected)!r}; "
                  f"received {sorted(actual)!r}"
              )
          PY
      - name: Retain the exact release distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/kinetic-trust-library
    permissions:
      id-token: write
    steps:
      - name: Retrieve the exact release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

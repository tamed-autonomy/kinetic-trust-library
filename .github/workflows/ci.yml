name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  base:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run base tests and examples 01-03
        env:
          PYTHONPATH: src
        run: python tools/run_required_tests.py --start-dir tests/unit --top-level-dir .
      - name: Check the pinned catalogue
        env:
          PYTHONPATH: src
        run: python tools/compile_catalog.py --check

  crypto:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the optional cryptography adapter
        run: python -m pip install --disable-pip-version-check --no-input ".[cryptography]"
      - name: Run optional cryptography tests and example 04
        run: python tools/run_required_tests.py --start-dir tests_crypto --top-level-dir .
      - name: Run provider contract tests
        run: python tools/run_required_tests.py --start-dir tests_provider --top-level-dir .

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the build frontend
        run: python -m pip install --disable-pip-version-check --no-input build==1.5.0
      - name: Build the exact wheel and source distribution
        run: python -m build
      - name: Verify archive identity, metadata, and package paths
        shell: bash
        run: |
          set -euo pipefail
          WHEEL=dist/kinetic_trust_library-2.1.0-py3-none-any.whl
          SDIST=dist/kinetic_trust_library-2.1.0.tar.gz
          test -f "$WHEEL"
          test -f "$SDIST"
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          python -c 'import email.parser,sys,zipfile; wheel=zipfile.ZipFile(sys.argv[1]); names=wheel.namelist(); metadata_name=next(name for name in names if name.endswith(".dist-info/METADATA")); metadata=email.parser.Parser().parsestr(wheel.read(metadata_name).decode()); requirements=metadata.get_all("Requires-Dist", []); payload=[name for name in names if ".dist-info/" not in name]; assert metadata["Name"] == "kinetic-trust-library"; assert metadata["Version"] == "2.1.0"; assert metadata["License-Expression"] == "Apache-2.0"; assert "Specification, https://github.com/nmcitra/ktp-rfc/tree/v2.1.0" in metadata.get_all("Project-URL", []); assert len(requirements) == 1 and requirements[0].startswith("cryptography") and "extra ==" in requirements[0]; assert payload and all(name.startswith("kinetic_trust_library/") for name in payload)' "$WHEEL"
          python -c 'import sys,tarfile; names=tarfile.open(sys.argv[1], "r:gz").getnames(); assert any("/src/kinetic_trust_library/" in name for name in names); assert not any("/src/kinetic_trust_core/" in name for name in names); source_payload=[name.split("/src/", 1)[1] for name in names if "/src/" in name]; assert source_payload and all(name.startswith("kinetic_trust_library/") for name in source_payload); required=("/README.md", "/LICENSE", "/NOTICE", "/examples/"); assert all(any(part in name for name in names) for part in required)' "$SDIST"
      - name: Install the wheel and run source-distribution examples
        shell: bash
        run: |
          set -euo pipefail
          WHEEL="$GITHUB_WORKSPACE/dist/kinetic_trust_library-2.1.0-py3-none-any.whl"
          SDIST="$GITHUB_WORKSPACE/dist/kinetic_trust_library-2.1.0.tar.gz"
          python -m venv "$RUNNER_TEMP/package-smoke"
          "$RUNNER_TEMP/package-smoke/bin/python" -m pip install \
            --disable-pip-version-check --no-index --no-deps "$WHEEL"
          mkdir -p "$RUNNER_TEMP/sdist"
          tar -xzf "$SDIST" -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP"
          PYTHONPATH= "$RUNNER_TEMP/package-smoke/bin/python" -I -c \
            'from importlib.metadata import distributions, version; from importlib.util import find_spec; import kinetic_trust_library, kinetic_trust_library.core, kinetic_trust_library.proofs, kinetic_trust_library.protocols; import kinetic_trust_library.soul_constraint as soul_constraint; import kinetic_trust_library.trajectory as trajectory; assert callable(kinetic_trust_library.validate_absolute_uri); assert callable(soul_constraint.parse_soul_constraint); assert callable(trajectory.parse_trajectory_transaction); assert callable(trajectory.assess_trajectory_link); assert version("kinetic-trust-library") == "2.1.0"; assert kinetic_trust_library.KTP_SPEC_TAG == "v2.1.0"; assert find_spec("kinetic_trust_core") is None; assert "kinetic-trust-core" not in {(item.metadata["Name"] or "").lower() for item in distributions()}'
          SDIST_ROOT="$RUNNER_TEMP/sdist/kinetic_trust_library-2.1.0"
          PYTHONPATH= "$RUNNER_TEMP/package-smoke/bin/python" \
            "$SDIST_ROOT/examples/01_core_and_envelope_evaluation.py"
          PYTHONPATH= "$RUNNER_TEMP/package-smoke/bin/python" \
            "$SDIST_ROOT/examples/02_fail_closed_evaluation_outcomes.py"
          PYTHONPATH= "$RUNNER_TEMP/package-smoke/bin/python" \
            "$SDIST_ROOT/examples/03_observations_from_application_apis.py"

  required:
    name: required
    if: ${{ always() }}
    needs: [base, crypto, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every mandatory CI job
        env:
          BASE_RESULT: ${{ needs.base.result }}
          CRYPTO_RESULT: ${{ needs.crypto.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$BASE_RESULT" = success
          test "$CRYPTO_RESULT" = success
          test "$PACKAGE_RESULT" = success
